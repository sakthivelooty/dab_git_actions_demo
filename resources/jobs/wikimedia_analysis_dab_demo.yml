resources:
  jobs:
    dab_demo_git_actions:
      name: dab_demo_git_actions
      tasks:
        - task_key: spark_consumer
          notebook_task:
            notebook_path: ../../src/spark_ingestion/spark_kafka_consumer.py
            source: WORKSPACE
          job_cluster_key: spark_consumer_cluster
        - task_key: gold_agg_table
          depends_on:
            - task_key: spark_consumer
          notebook_task:
            notebook_path: ../../src/spark_ingestion/wikimedia_gold_agg.py
            source: WORKSPACE
          job_cluster_key: spark_consumer_cluster
      
      job_clusters:
        - job_cluster_key: spark_consumer_cluster
          new_cluster:
            cluster_name: ""
            spark_version: 17.3.x-scala2.13
            azure_attributes:
              availability: SPOT_WITH_FALLBACK_AZURE
            node_type_id: Standard_D4ds_v5
            spark_env_vars:
              PYSPARK_PYTHON: /databricks/python3/bin/python3
            data_security_mode: DATA_SECURITY_MODE_STANDARD
            runtime_engine: PHOTON
            kind: CLASSIC_PREVIEW
            is_single_node: false
            num_workers: 1
      queue:
        enabled: true
